name: Build BuildWise API Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/BuildWise.Api/**"
      - "Dockerfile"
      - ".github/workflows/build-api-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/it24102414/buildwise-api:latest
            ghcr.io/it24102414/buildwise-api:${{ github.sha }}
